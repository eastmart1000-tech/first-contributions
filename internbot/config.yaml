action_pause_seconds: [0.8, 2.5]
headless: false

# --- Form answers ----------------------------------------------------------
# Ordered: the FIRST pattern (case-insensitive regex) that matches the
# question text wins. `answer` can be a single value or a list of
# alternatives; for dropdowns/radios the first alternative that matches an
# option is picked. A required question with no matching rule is NOT guessed:
# the application is discarded and logged as skipped_unanswered, with the
# question in the `note` column so you can add a rule for it.
answers:
  # identity / contact
  - pattern: "first name"
    answer: "{first_name}"
  - pattern: "last name|surname"
    answer: "{last_name}"
  - pattern: "^(full )?name\\b"
    answer: "{first_name} {last_name}"
  - pattern: "e-?mail"
    answer: "{email}"
  - pattern: "phone country code|country code"
    answer: ["United States (+1)", "United States"]
  - pattern: "phone|mobile"
    answer: "{phone}"
  - pattern: "linkedin"
    answer: "{linkedin_url}"

  # work authorization (sponsorship first: those questions often mention "authorization" too)
  - pattern: "sponsor|visa"
    answer: "{needs_sponsorship}"
  - pattern: "authori[sz]ed to work|legally (authori[sz]ed|eligible|permitted)|eligible to work|work authori[sz]ation"
    answer: "{authorized_to_work_us}"
  - pattern: "18 years|at least 18|over the age of 18"
    answer: "Yes"

  # logistics (review these: they are reasonable defaults, not facts)
  - pattern: "commut|on-?site|in[- ]office|this location|willing to work (at|in|from)"
    answer: "Yes"
  - pattern: "relocat"
    answer: "Yes"
  - pattern: "summer 2027|available.*summer"
    answer: "Yes"
  - pattern: "start date|available to start|when can you start|earliest.*start"
    answer: "May 2027"
  - pattern: "how did you hear"
    answer: ["LinkedIn", "Job board", "Online"]
  - pattern: "\\bcity\\b|current location|^location"
    answer: "{city}"

  # education
  - pattern: "have you (completed|earned|obtained|received).*(bachelor|degree)"
    answer: "No"
  - pattern: "currently enrolled|current(ly)? (a )?(full[- ]time )?student|pursuing a degree"
    answer: "Yes"
  - pattern: "\\bgpa\\b|grade point"
    answer: "{gpa}"
  - pattern: "graduat"
    answer: ["{graduation}", "2029"]
  - pattern: "level of education|degree.*(pursuing|seeking)|highest.*education|what degree"
    answer: ["Bachelor's Degree", "Bachelor's", "Bachelor", "Bachelors"]
  - pattern: "\\bmajor\\b|field of study|discipline"
    answer: ["{major}", "Electrical Engineering", "Engineering"]
  - pattern: "(school|university|college)( name)?\\??$|which (school|university)|where.*(attend|study)"
    answer: "{school}"

  # years of experience (specific first, generic last)
  - pattern: "years.*(excel|microsoft office)"
    answer: "3"
  - pattern: "years.*(customer service|leadership|supervis|team lead)"
    answer: "3"
  - pattern: "years.*(data center|network|cabling)"
    answer: "1"
  - pattern: "how many years|years of (work )?experience"
    answer: "0"

  # voluntary self-identification (EEO)
  - pattern: "gender|sex\\b|pronoun"
    answer: ["I don't wish to answer", "Decline", "Prefer not"]
  - pattern: "\\brace\\b|ethnic|hispanic|latino"
    answer: ["I don't wish to answer", "Decline", "Prefer not"]
  - pattern: "veteran"
    answer: ["I don't wish to answer", "Decline", "Prefer not", "I am not a protected veteran"]
  - pattern: "disabilit"
    answer: ["I don't wish to answer", "Decline", "Prefer not"]
