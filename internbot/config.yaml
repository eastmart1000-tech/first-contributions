# internbot config. apply.py refuses to start while any value still says FILL_ME.

# --- About you -------------------------------------------------------------
# Answers below can use these as {placeholders}, e.g. answer: "{phone}".
# Quote Yes/No answers ("Yes"), otherwise YAML reads them as true/false.
profile:
  first_name: "Easton"
  last_name: "Martin"
  email: "easton.martin@okstate.edu"
  phone: "FILL_ME"                     # e.g. "9185551234" (digits only works best)
  city: "Tulsa, Oklahoma"
  linkedin_url: "FILL_ME"              # e.g. "https://www.linkedin.com/in/your-handle"
  authorized_to_work_us: "FILL_ME"     # "Yes" or "No"
  needs_sponsorship: "FILL_ME"         # "Yes" or "No" (now or in the future)
  gpa: "3.47"
  school: "Oklahoma State University"
  major: "Electrical Engineering Technology"
  graduation: "May 2029"

# Path to your resume PDF. Relative paths are relative to this folder.
# Keep the PDF out of git (it's in .gitignore).
resume_path: "FILL_ME"                 # e.g. "Easton_Martin_Resume.pdf"

# --- Search ----------------------------------------------------------------
# Every search is run in every location (searches x locations).
searches:
  - "electrical engineering intern"
  - "electrical engineering technology intern"
  - "power engineering intern"
  - "utility intern"
  - "controls engineering intern"
  - "automation intern"
  - "accounting intern"
  - "audit intern"
  - "tax intern"

locations:
  - "Stillwater, Oklahoma, United States"
  - "Tulsa, Oklahoma, United States"
  - "Oklahoma City, Oklahoma, United States"
  - "Dallas, Texas, United States"

distance_miles: 25
posted_within_days: 14
max_pages_per_search: 2      # 25 results per page

